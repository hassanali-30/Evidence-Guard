[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "evidence-guard"
version = "1.1.0"
description = "Offline file-integrity verification and tamper-evident evidence ledgers"
readme = "README.md"
requires-python = ">=3.10"
license = { file = "LICENSE" }
authors = [
  { name = "Hassan Ali" }
]
keywords = ["cybersecurity", "file-integrity", "incident-response", "forensics", "soc"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Environment :: Console",
  "Intended Audience :: Information Technology",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
  "Topic :: Security",
]

[project.scripts]
evidenceguard = "evidenceguard:main"

[tool.setuptools]
py-modules = ["evidenceguard"]
